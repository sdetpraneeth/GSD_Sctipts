name: Daily Scheduled JavaScript Task

on:
  schedule:
    # Runs daily at 4:00 PM IST (10:30 AM UTC)
    - cron: '30 10 * * *'
  # Allows manual triggers anytime from the GitHub UI
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run JavaScript script
        run: node index.js

      - name: Send SUCCESS Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAILUSERS }}
          password: ${{ secrets.MAILPASSWORD }}
          subject: "SUCCESS: Daily Job Execution"
          to: "praneeth.elapavanam@innovasolutions.com"
          from: "GitHub Actions <${{ secrets.MAILUSERS }}>"
          body: "The scheduled Node.js script executed successfully!"

      - name: Send FAILURE Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAILUSERS }}
          password: ${{ secrets.MAILPASSWORD }}
          subject: "FAILED: Daily Job Execution"
          to: "praneeth.elapavanam@innovasolutions.com"
          from: "GitHub Actions <${{ secrets.MAILUSERS }}>"
          body: "The scheduled Node.js script failed. Check your GitHub Actions logs for details."
